<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Dodo - Professional Media Hub</title>
    
    <!-- ब्राउज़र टैब (टास्कबार) के लिए आपका लाल आइकॉन -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a0505, #0a0f1d);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(20, 20, 30, 0.85);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(255, 0, 0, 0.2);
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(255, 0, 0, 0.3);
            text-align: center;
        }
        h1 {
            color: #ff3333;
            margin-bottom: 10px;
        }
        p {
            color: #b0b0b0;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .shortcuts {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
        }
        .shortcuts a {
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 13px;
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .shortcuts a:hover {
            background: rgba(255, 0, 0, 0.2);
            border-color: #ff3333;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #ff3333, #cc0000);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚡ YT DODO</h1>
        <p>Professional Universal Media Hub & Downloader</p>
        
        <!-- प्लेटफॉर्म शॉर्टकट बटन्स -->
        <div class="shortcuts">
            <a href="https://www.youtube.com" target="_blank">YouTube</a>
            <a href="https://www.google.com" target="_blank">Google</a>
            <a href="https://www.facebook.com" target="_blank">Facebook</a>
            <a href="https://www.instagram.com" target="_blank">Instagram</a>
        </div>

        <form action="/download" method="POST">
            <input type="text" name="url" placeholder="Paste YouTube, Instagram or Video link..." required>
            
            <select name="format">
                <option value="best">Video - 720p (HD)</option>
                <option value="audio">Audio Only (MP3)</option>
            </select>

            <button type="submit">Search & Download</button>
        </form>
    </div>

</body>
</html>
